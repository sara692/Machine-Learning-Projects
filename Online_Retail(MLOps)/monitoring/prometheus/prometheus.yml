global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: segmentation-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: pushgateway
    honor_labels: true          # keep the job="drift-job" label set by drift.py
    static_configs:
      - targets: ["pushgateway:9091"]
